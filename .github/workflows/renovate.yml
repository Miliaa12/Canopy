name: Renovate

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - "renovate.json"
      - ".github/workflows/renovate.yml"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: renovatebot/github-action@v46.3.8
        with:
          configurationFile: renovate.json
          token: "${{ secrets.GITHUB_TOKEN }}"
